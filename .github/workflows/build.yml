name: Build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Enforce independent library boundary
        run: '! rg "com\.ljyh\.mei" glasmio-*/src'
      - run: ./gradlew testDebugUnitTest lintDebug :sample:assembleDebug :sample:assembleDebugAndroidTest publishAllPublicationsToStagingRepository --console=plain
      - name: Verify published dependency graph in a fresh consumer
        run: python3 scripts/verify_consumer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-sample
          path: |
            **/build/reports/
            sample/build/outputs/apk/debug/*.apk
