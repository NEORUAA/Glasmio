name: Build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Enforce independent library boundary
        run: '! rg "com\.ljyh\.mei" glasmio-*/src'
      - run: ./gradlew testDebugUnitTest lintDebug :sample:assembleDebug :sample:assembleDebugAndroidTest publishAllPublicationsToStagingRepository --console=plain
      - name: Verify published dependency graph in a fresh consumer
        run: python3 scripts/verify_consumer.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run navigation and search interaction regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          script: |
            adb shell wm size 720x1600
            adb shell wm density 320
            ./gradlew :sample:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.neoruaa.glasmio.sample.ComponentBehaviorTest#largeTypeNavigationLabelsStaySeparateAndTabsRemainClickable,io.github.neoruaa.glasmio.sample.SampleNavigationBehaviorTest#floatingSearchFindsDescriptionsAndKeepsOriginalRoutes,io.github.neoruaa.glasmio.sample.SampleNavigationBehaviorTest#floatingSearchRecoversFromNoResultsWithWhitespaceQuery,io.github.neoruaa.glasmio.sample.SampleNavigationBehaviorTest#floatingSearchFiltersCancelsAndStartsEmptyOnReentry,io.github.neoruaa.glasmio.sample.SampleNavigationBehaviorTest#rootNavigationCompactsOnScrollAndExpandsWithoutChangingTheTab,io.github.neoruaa.glasmio.sample.SampleNavigationBehaviorTest#dynamicTypePickerChangesTheRenderedSemanticStyle --console=plain || { result=$?; mkdir -p build/pr7-emulator; adb logcat -d -v threadtime > build/pr7-emulator/logcat.txt || true; adb exec-out screencap -p > build/pr7-emulator/failure.png || true; exit "$result"; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-sample
          path: |
            **/build/reports/
            build/pr7-emulator/
            **/build/test-results/
            **/build/outputs/androidTest-results/
            sample/build/outputs/apk/debug/*.apk
            sample/build/outputs/apk/androidTest/debug/*.apk
